<!doctype html>
<!--
  TEMPLATE PAGINA PROGETTO
  1. Copia questa cartella in /projects/<slug>/
  2. Sostituisci {{SLUG}}, {{NOME}}, {{CATEGORIA}}, {{categoria-slug}}, {{DESCRIZIONE}}
  3. Metti l'icona in /assets/icons/<slug>.svg (o .png)
  4. Aggiungi la voce in /projects/projects.json
  Se è una web app, puoi sostituire il contenuto di <main> con la tua app
  (CSS/JS propri nella stessa cartella) mantenendo header e footer.
-->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">  <!-- RIMUOVI questa riga nel progetto reale -->
  <title>{{NOME}} · Progetti · Giovanni Zaccaria</title>
  <meta name="description" content="{{DESCRIZIONE}}">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <script src="/assets/js/theme.js"></script>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <script src="/assets/js/site.js" defer></script>
</head>
<body data-breadcrumb='[{"label":"Progetti","href":"/projects/"},{"label":"{{NOME}}"}]'>
  <a class="skip-link" href="#main">Vai al contenuto</a>
  <header data-site-header>
    <noscript><div class="noscript-nav"><a href="/">Home</a> · <a href="/projects/">Progetti</a> · <a href="/legal/">Legal</a> · <a href="/resources/">Risorse</a></div></noscript>
  </header>
  <nav data-breadcrumb></nav>

  <main id="main">
    <div class="container">
      <header class="page-head">
        <div class="project-head">
          <div class="project-icon project-icon-lg">
            <img src="/assets/icons/{{SLUG}}.svg" alt="" width="64" height="64" onerror="this.onerror=null;this.src='/assets/icons/fallback.svg'">
          </div>
          <div>
            <h1>{{NOME}}</h1>
            <span class="badge" data-category="{{categoria-slug}}">{{CATEGORIA}}</span>
          </div>
        </div>
        <p class="lead">{{DESCRIZIONE}}</p>
        <div class="btn-row">
          <a class="btn btn-primary" href="https://github.com/LoZack19/{{SLUG}}" target="_blank" rel="noopener">Codice su GitHub</a>
          <!-- Se il progetto ha documenti legali: -->
          <a class="btn" href="/legal/{{SLUG}}/privacy.html">Privacy Policy</a>
          <a class="btn" href="/legal/{{SLUG}}/terms.html">Termini di Servizio</a>
        </div>
      </header>

      <div class="project-body">
        <h2>Panoramica</h2>
        <p>Descrivi qui il progetto.</p>
      </div>
    </div>
  </main>

  <footer data-site-footer></footer>
</body>
</html>
